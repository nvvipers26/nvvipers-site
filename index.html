<!doctype html>
<html lang="en" data-look="scales">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Valley Vipers | Girls Flag Football</title>
<meta name="description" content="North Valley Vipers girls flag football club. Schedule, tournaments, mission and core values.">
<meta property="og:title" content="North Valley Vipers | Girls Flag Football">
<meta property="og:description" content="Girls Flag Football Club. Est. 2026">
<meta property="og:image" content="https://nvvipers.com/images/logo-share.png">
<meta property="og:url" content="https://nvvipers.com/">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="root"><p style="padding:2rem;text-align:center">Loading the Vipers…</p></div>
<script>
(function(){
"use strict";
var LOGO='/images/logo.webp';
var TYPES={game:'Game',tournament:'Tournament'};
var root=document.getElementById('root');
var club={}, events=[], ann={};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function isoDate(s){return String(s||'').slice(0,10);}
function toDate(iso){var p=isoDate(iso).split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function mins(t){
  var m=String(t||'').trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$/);
  if(!m)return 9999;
  var h=+m[1],mi=+m[2],ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h<12)h+=12; if(ap==='AM'&&h===12)h=0;
  return h*60+mi;
}
function fmtTime(t){
  t=String(t||'').trim(); if(!t)return '';
  var m=t.match(/^(\d{1,2}):(\d{2})$/);
  if(m){var h=+m[1];return (h%12||12)+':'+m[2]+' '+(h>=12?'PM':'AM');}
  return t.replace(/\s*([ap])m$/i,function(x,a){return ' '+a.toUpperCase()+'M';});
}
function fmtLong(iso){return toDate(iso).toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});}
function rel(iso){var a=toDate(todayISO()),b=toDate(iso);var n=Math.round((b-a)/864e5);if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n<7)return 'In '+n+' days';if(n<14)return 'Next week';return 'In '+Math.round(n/7)+' weeks';}
function games(ev){return (Array.isArray(ev.games)?ev.games:[]).slice().sort(function(a,b){return mins(a.time)-mins(b.time);});}
function startTime(ev){if(ev.type==='tournament'){var g=games(ev).filter(function(x){return x.time;})[0];return g?g.time:'';}return ev.time||'';}
function sortEv(a,b){var d=isoDate(a.date).localeCompare(isoDate(b.date));return d||mins(startTime(a))-mins(startTime(b));}
function mapUrl(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
function vs(name){name=String(name||'').trim();if(!name)return 'Opponent TBD';return /^(vs\.?|@)\s/i.test(name)?name:'vs. '+name;}
function title(ev){if(ev.type==='tournament')return ev.title||'Tournament';return ev.title?vs(ev.title):'Game';}
function teamTag(ev){return ev.type==='tournament'?(ev.level||''):(ev.team||'');}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(/^(mailto:|tel:)/i.test(u))return u;if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}

var ICONS={
  faith:'<path d="M12 2.5v19"/><path d="M6.5 8h11"/>',
  family:'<circle cx="9" cy="7.5" r="3.2"/><path d="M2.8 20c0-3.4 2.8-6.2 6.2-6.2s6.2 2.8 6.2 6.2"/><circle cx="17.2" cy="8.8" r="2.5"/><path d="M16.6 13.9c2.7.3 4.6 2.7 4.6 5.6"/>',
  support:'<path d="M12 12.2s-4.6-2.7-4.6-5.7A2.5 2.5 0 0 1 12 5.3a2.5 2.5 0 0 1 4.6 1.2c0 3-4.6 5.7-4.6 5.7z"/><path d="M2.5 15.5h3.2l3.6 2.7h5.4a1.6 1.6 0 0 0 0-3.2H11.8"/><path d="M14.7 18.2l4.6-2.8a1.6 1.6 0 0 0-1.7-2.7l-3.4 2.1"/>',
  trust:'<path d="M12 2.8l7.5 3v5.4c0 4.6-3.2 8.3-7.5 10-4.3-1.7-7.5-5.4-7.5-10V5.8z"/><path d="M8.4 12.2l2.6 2.6 4.6-5"/>',
  growth:'<path d="M12 21v-9"/><path d="M12 12C12 8.3 9.4 5.8 5.2 5.8c0 3.7 2.6 6.2 6.8 6.2z"/><path d="M12 14.2c0-3.7 2.6-6.2 6.8-6.2 0 3.7-2.6 6.2-6.8 6.2z"/><path d="M7 21h10"/>'
};
function icon(name){var p=ICONS[String(name||'').toLowerCase()]||'<circle cx="12" cy="12" r="7"/>';return '<span class="v-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg></span>';}
function valuesHtml(vs){
  if(!Array.isArray(vs)||!vs.length)return '';
  return '<h3 class="values-head">Our core values</h3><dl class="values">'+vs.map(function(v){return '<div><dt>'+icon(v.name)+'<span>'+esc(v.name)+'</span></dt><dd>'+esc(v.text)+'</dd></div>';}).join('')+'</dl>';
}

function gamesList(ev){
  var gs=games(ev);
  if(!gs.length)return '';
  return '<ul class="games">'+gs.map(function(g){
    return '<li><span class="g-time">'+(g.time?esc(fmtTime(g.time)):'TBD')+'</span><span class="g-opp">'+esc(vs(g.opponent))+(g.type?' <span class="g-type'+(g.type==='Championship'?' champ':'')+'">'+esc(g.type)+'</span>':'')+'</span>'+
      (g.field?'<span class="g-field">'+esc(g.field)+'</span>':'')+(g.score?'<span class="g-score">'+esc(g.score)+'</span>':'')+'</li>';
  }).join('')+'</ul>';
}

function eventRow(ev){
  var d=toDate(ev.date), type=ev.type==='tournament'?'tournament':'game';
  var meta=[];
  if(type==='game'&&ev.time)meta.push(esc(fmtTime(ev.time)));
  if(ev.location||ev.address)meta.push('<a href="'+esc(mapUrl(ev.address||ev.location))+'" target="_blank" rel="noopener">'+esc(ev.location||ev.address)+'</a>');
  var side=ev.result?'<div class="side"><span class="result">'+esc(ev.result)+'</span></div>':'';
  return '<li class="ev type-'+type+'">'+
    '<div class="date" aria-hidden="true"><span class="dow">'+d.toLocaleDateString([], {weekday:'short'})+'</span><span class="day">'+d.getDate()+'</span><span class="mon">'+d.toLocaleDateString([], {month:'short'})+'</span></div>'+
    '<div class="ev-body"><span class="sr">'+esc(fmtLong(ev.date))+'. </span><h3><span class="chip '+type+'">'+TYPES[type]+'</span>'+
    (teamTag(ev)?'<span class="chip team">'+esc(teamTag(ev))+'</span>':'')+
    (type==='game'&&ev.gameType?'<span class="chip stage'+(ev.gameType==='Championship'?' champ':'')+'">'+esc(ev.gameType)+'</span>':'')+esc(title(ev))+'</h3>'+
    (meta.length?'<p class="meta">'+meta.join(' at ')+'</p>':'')+(ev.address&&ev.location?'<p class="meta">'+esc(ev.address)+'</p>':'')+
    (ev.notes?'<p class="notes">'+esc(ev.notes)+'</p>':'')+
    (type==='tournament'?(ev.tbd?'<p class="tbd">Game schedule TBD</p>':gamesList(ev)):'')+'</div>'+side+'</li>';
}

function listByMonth(evs){
  var out='',cur='',open=false;
  evs.forEach(function(ev){
    var m=toDate(ev.date).toLocaleDateString([], {month:'long',year:'numeric'});
    if(m!==cur){if(open)out+='</ul>';out+='<h3 class="month">'+esc(m)+'</h3><ul class="events">';cur=m;open=true;}
    out+=eventRow(ev);
  });
  if(open)out+='</ul>';
  return out;
}

function nextCard(next,ig){
  if(!next)return '<div class="next"><div class="lead"><span>Next up</span></div><h2>Season schedule coming soon</h2><p class="loc">Games and tournaments will show up here as soon as they’re posted.</p><div class="actions"><a href="https://instagram.com/'+esc(ig)+'" target="_blank" rel="noopener">Follow @'+esc(ig)+' for updates</a></div></div>';
  var st=startTime(next), gs=next.type==='tournament'?games(next):[];
  var when=esc(fmtLong(next.date))+(st?(next.type==='tournament'?', first game at ':', ')+esc(fmtTime(st)):'');
  return '<div class="next" aria-label="Next on the schedule"><div class="lead"><span>Next up</span><span class="when-rel">'+esc(rel(next.date))+'</span></div>'+
    '<h2>'+esc(title(next))+'</h2>'+(teamTag(next)?'<p class="team-line">Playing as '+esc(teamTag(next))+'</p>':'')+'<p>'+when+'</p>'+
    (next.type==='tournament'&&next.tbd?'<p class="loc">Game schedule TBD</p>':gs.length?'<p class="loc">'+gs.length+(gs.length===1?' game':' games')+' scheduled</p>':'')+
    (next.location||next.address?'<p class="loc">'+esc([next.location,next.address].filter(Boolean).join(', '))+'</p>':'')+
    '<div class="actions"><a href="#schedule">Full schedule</a>'+(next.location||next.address?'<a href="'+esc(mapUrl(next.address||next.location))+'" target="_blank" rel="noopener">Directions</a>':'')+'</div></div>';
}

function announcementHtml(){
  if(!ann||!ann.show)return '';
  if(!String(ann.title||'').trim()&&!String(ann.message||'').trim())return '';
  var end=isoDate(ann.hideAfter);
  if(end&&todayISO()>end)return '';
  var url=safeUrl(ann.linkUrl);
  return '<section class="announce-wrap" aria-labelledby="announce-title"><div class="wrap"><div class="announce">'+
    '<span class="a-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg></span>'+
    '<div><p class="a-label">Announcement</p><h2 id="announce-title">'+esc(ann.title||'Team update')+'</h2>'+(ann.message?'<p class="a-msg">'+esc(ann.message)+'</p>':'')+'</div>'+
    (url?'<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(ann.linkText||'Learn more')+'</a>':'')+
    '</div></div></section>';
}

function render(){
  var t=todayISO(), c=club, ig=c.instagram||'nv_vipers';
  document.documentElement.setAttribute('data-look',c.look==='classic'?'classic':'scales');
  var evs=events.slice().sort(sortEv);
  var up=evs.filter(function(e){return isoDate(e.date)>=t;});
  var past=evs.filter(function(e){return isoDate(e.date)<t;}).reverse();
  var schedule=up.length?listByMonth(up):'<div class="empty"><strong>No upcoming events yet</strong>Check back soon, or follow @'+esc(ig)+' on Instagram for updates.</div>';
  var pastHtml=past.length?'<details class="past"><summary>Past events and results ('+past.length+')</summary><ul class="events">'+past.map(eventRow).join('')+'</ul></details>':'';
  var igSvg='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';

  root.innerHTML=
  '<header class="top"><div class="wrap"><a class="brand" href="#top"><img src="'+LOGO+'" alt="">Vipers</a><nav aria-label="Main"><a href="#schedule">Schedule</a><a href="#about">About</a><a class="ig" href="https://instagram.com/'+esc(ig)+'" target="_blank" rel="noopener" aria-label="Instagram @'+esc(ig)+'" title="@'+esc(ig)+'">'+igSvg+'</a></nav></div></header>'+
  '<main id="top"><div class="hero-wrap"><section class="hero"><div class="wrap"><img class="hero-logo" src="'+LOGO+'" alt="North Valley Vipers logo: an orange viper head beneath the team name"><div class="hero-text"><h1>North Valley Vipers</h1><p class="tagline">'+esc(c.tagline||'Girls flag football club')+'</p>'+nextCard(up[0],ig)+'</div></div></section></div>'+
  announcementHtml()+
  '<section class="block" id="schedule"><div class="wrap"><div class="sec-head"><div><h2>Schedule</h2><p>Games and tournaments. Tap a location for directions.</p></div></div>'+schedule+pastHtml+'</div></section>'+
  '<section class="block about" id="about"><div class="wrap about-one"><div class="about-split"><div class="about-copy"><div class="sec-head"><h2>About the club</h2></div><p class="about-text">'+esc(c.about||'')+'</p>'+
  '<div class="sec-head mission-head"><h2>Our mission</h2></div><p class="mission">'+esc(c.mission||'')+'</p></div>'+
  (c.photo?'<figure class="about-photo"><img src="'+esc(c.photo)+'" alt="'+esc(c.photoAlt||'North Valley Vipers player')+'" loading="lazy"></figure>':'')+'</div>'+valuesHtml(c.values)+'</div></section></main>'+
  '<footer><div class="wrap"><span>© '+new Date().getFullYear()+' North Valley Vipers Girls Flag Football</span><a href="https://instagram.com/'+esc(ig)+'" target="_blank" rel="noopener">@'+esc(ig)+'</a></div></footer>';
}

function load(path){return fetch(path,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(path);return r.json();});}
Promise.all([
  load('/content/club.json').catch(function(){return {};}),
  load('/content/schedule.json').catch(function(){return {events:[]};}),
  load('/content/announcement.json').catch(function(){return {};})
]).then(function(r){
  club=r[0]||{}; events=Array.isArray(r[1]&&r[1].events)?r[1].events:[]; ann=r[2]||{};
  render();
});
})();
</script>
</body>
</html>
